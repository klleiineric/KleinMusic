name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "native/**"
      - "*.md"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK de depuração
        run: gradle assembleDebug --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KleinMusic-debug.apk

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: KleinMusic-apk
          path: KleinMusic-debug.apk

      - name: Publicar em Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Klein Music build ${{ github.run_number }}
          prerelease: true
          files: KleinMusic-debug.apk
