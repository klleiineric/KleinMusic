name: Compilar motor de anúncios (Rust para Android)

on:
  workflow_dispatch:
  push:
    paths:
      - "native/adblock/**"
      - ".github/workflows/adblock-native.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compilar para Android
        working-directory: native/adblock
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release

      - name: Guardar arquivos .so
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs
